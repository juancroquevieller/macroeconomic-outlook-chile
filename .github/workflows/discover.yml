name: Discover BCCh series
on:
  push:
    paths: ['.github/workflows/discover.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public catalog using secret
        env:
          BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,pathlib
          root=pathlib.Path('data/catalog'); root.mkdir(parents=True,exist_ok=True)
          token=os.environ['BCCH_API_TOKEN']
          if not token: raise SystemExit('BCCH_API_TOKEN is missing')
          for freq in ['MONTHLY','QUARTERLY','DAILY']:
              url='https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx?'+urllib.parse.urlencode(dict(token=token,function='SearchSeries',frequency=freq))
              try:
                  response=urllib.request.urlopen(url,timeout=120)
                  body=response.read()
                  encoding=response.headers.get_content_charset() or 'utf-8-sig'
                  try: text=body.decode(encoding)
                  except UnicodeDecodeError: text=body.decode('cp1252')
                  data=json.loads(text)
                  if data.get('Codigo')!=0: raise ValueError('API rejected request')
                  rows=data['SeriesInfos']
                  (root/(freq.lower()+'.json')).write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
                  print(freq, len(rows),'series retrieved')
              except Exception as exc:
                  print('Failure type:',type(exc).__name__)
                  print('HTTP status:',getattr(exc,'code',None))
                  raise SystemExit('Catalog request failed; credentials and URL withheld')
          PY
      - name: Save catalog
        run: |
          git config user.name "Dashboard refresh"
          git config user.email "dashboard@users.noreply.github.com"
          git add data/catalog
          git diff --cached --quiet || (git commit -m "Record official BCCh series catalog" && git push)
