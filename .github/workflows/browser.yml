name: Browser visual review
on:
  workflow_dispatch:
  push:
    paths: ['data/snapshot.json', 'us_cpi.py', 'app.py', 'model.py', 'scripts/browser_review.py', '.github/workflows/browser.yml']
permissions:
  contents: write
concurrency:
  group: browser-review
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start exact source version
        run: |
          python -m streamlit run app.py --server.headless true > /tmp/dashboard.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8501/_stcore/health && break || sleep 1; done
      - run: python scripts/browser_review.py
      - name: Capture deployed Streamlit app
        env:
          DASHBOARD_URL: https://macroeconomic-outlook-chile-2nx6g2qvukrcaexz7ycssk.streamlit.app/
          SCREENSHOT_DIR: verification/browser/live
        run: python scripts/browser_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: verification/browser
      - name: Save review images
        if: always()
        run: |
          git config user.name 'Dashboard visual review'
          git config user.email 'dashboard@users.noreply.github.com'
          git add verification/browser
          git diff --cached --quiet || (git commit -m 'Capture rendered dashboard for visual review' && git pull --rebase origin main && git push)

